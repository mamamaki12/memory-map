<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#167766"><title>Memory Map — 思い出を、地図に。</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="./style.css">
<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script defer src="./app.js"></script>
</head>
<body>
<header><a class="brand" href="./"><span class="logo">◎</span><span>Memory Map<small>思い出を、地図に。</small></span></a><button id="backup" class="quiet">バックアップ</button></header>
<main><aside><div class="intro"><span class="eyebrow">YOUR PERSONAL ATLAS</span><h1>ここにいた、<br>を残そう。</h1><p>いつもの道も、初めての街も。<br>写真から広がる、あなただけの地図。</p></div>
<div class="section-title"><h2>思い出</h2><span id="count">0 枚</span></div>
<div id="list" class="list"><p class="empty">まだ写真がありません。<br>最初の一枚を撮ってみましょう。</p></div>
<p class="privacy">写真はこの端末のブラウザに保存されます。大切な写真はバックアップしてください。</p></aside>
<section class="map-wrap" aria-label="写真の地図"><div id="map"></div><div class="map-tools"><button id="locate">⌖ 現在地</button><button id="fit">すべて表示</button></div><div id="place-hint" hidden>地図をタップして撮影場所を選んでください</div><div class="capture-bar"><button id="capture" class="primary">＋ 写真を撮る</button><span>今日の景色を、思い出に。</span></div></section></main>
<input id="file" type="file" accept="image/*" capture="environment" hidden>
<p id="status" role="status" aria-live="polite"></p>
<dialog id="editor"><form id="save-form"><div class="dialog-head"><h2>思い出を保存</h2><button type="button" id="cancel" aria-label="閉じる">×</button></div><img id="preview" alt="撮影した写真"><label>ひとこと<input id="caption" maxlength="100" placeholder="例：帰り道で見つけた夕焼け"></label><p id="location-label"></p><button type="button" id="choose" class="quiet">地図で場所を選び直す</button><button id="save" class="primary" type="submit">この場所に保存</button></form></dialog>
<dialog id="detail"><div class="dialog-head"><h2 id="detail-title">思い出</h2><button id="close-detail" aria-label="閉じる">×</button></div><img id="detail-image" alt=""><p id="detail-date"></p><button id="download" class="quiet">写真をダウンロード</button><button id="delete" class="danger">この写真を削除</button></dialog>
</body></html>
